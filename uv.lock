version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "aiosmtplib" },
    { name = "fastapi" },
    { name = "granian" },
    { name = "jinja2" },
    { name = "pydantic", extra = ["email"] },
    { name = "pydantic-settings" },
    { name = "python-multipart" },
]

[package.dev-dependencies]
dev = [
    { name = "granian", extra = ["reload"] },
]

[package.metadata]
requires-dist = [
    { name = "aiosmtplib", specifier = ">=3.0" },
    { name = "fastapi", specifier = ">=0.139.0" },
    { name = "granian", specifier = ">=2.8.1" },
    { name = "jinja2", specifier = ">=3.1" },
    { name = "pydantic", extras = ["email"], specifier = ">=2.13.4" },
    { name = "pydantic-settings", specifier = ">=2.14.2" },
    { name = "python-multipart", specifier = ">=0.0.9" },
]

[package.metadata.requires-dev]
dev = [{ name = "granian", extras = ["reload"], specifier = ">=2.7.9" }]
